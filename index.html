<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ayo Belajar Posisi Benda</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&family=Chewy&family=Fredoka:wght@500;600;700&family=Grandstander:wght@700;800&family=Lilita+One&family=Luckiest+Guy&family=Sniglet:wght@800&display=swap" rel="stylesheet">
<style>
/* Layout: satu kartu aplikasi di tengah. Gambar adegan selalu di atas, kata-kata di bawahnya, tombol besar untuk jari anak. */
:root{
  --bg:#E4F3FF; --card:#FFFFFF; --ink:#1D2B4A; --muted:#556589; --line:#C9E0F4;
  --blue:#2F7BEF; --blue-ink:#FFFFFF; --sun:#FFC83D; --sun-ink:#4A3300;
  --green:#2FB26F; --green-bg:#DDF5E8; --coral:#F2606A; --coral-bg:#FFE4E6; --purple:#7B5BE6;
  --sky1:#BFE6FF; --grass:#8ED89B; --sea:#5BB8F0; --wood:#B9772F; --wood2:#E0A04A;
  --wall:#B97B4B; --wall2:#AA6D40; --floor:#8A5530; --floor2:#734422; --board:#2F5D4A; --chalk:#F4F7EE; --blk-ink:#14213D;
  --pw1:#FFE0F0; --pw2:#D5ECFF; --pf1:#FFCB6B; --pf2:#FFB347;
  --font-display:"Chewy","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Fredoka","Trebuchet MS",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1830; --card:#1A2646; --ink:#EEF3FF; --muted:#A8B7D8; --line:#2E3E66;
    --blue:#6AA3FF; --blue-ink:#0B1530; --sun:#FFD25E; --sun-ink:#3A2900;
    --green:#4CD08C; --green-bg:#12382A; --coral:#FF8189; --coral-bg:#44202A; --purple:#A58EFF;
    --sky1:#24457D; --grass:#2E7D4F; --sea:#2A78B8; --wood:#9A6224; --wood2:#C98A3A;
  --wall:#4B3020; --wall2:#42291A; --floor:#34200F; --floor2:#2A1909; --board:#1F4034; --chalk:#E8EEE2; --blk-ink:#0B1530;
  --pw1:#3B2B63; --pw2:#223A74; --pf1:#7A4E1D; --pf2:#6A4217;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1830; --card:#1A2646; --ink:#EEF3FF; --muted:#A8B7D8; --line:#2E3E66;
  --blue:#6AA3FF; --blue-ink:#0B1530; --sun:#FFD25E; --sun-ink:#3A2900;
  --green:#4CD08C; --green-bg:#12382A; --coral:#FF8189; --coral-bg:#44202A; --purple:#A58EFF;
  --sky1:#24457D; --grass:#2E7D4F; --sea:#2A78B8; --wood:#9A6224; --wood2:#C98A3A;
  --wall:#4B3020; --wall2:#42291A; --floor:#34200F; --floor2:#2A1909; --board:#1F4034; --chalk:#E8EEE2; --blk-ink:#0B1530;
  --pw1:#3B2B63; --pw2:#223A74; --pf1:#7A4E1D; --pf2:#6A4217;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background-color:var(--wall);background-image:repeating-linear-gradient(90deg,transparent 0 118px,var(--wall2) 118px 122px);color:var(--ink);font-family:var(--font-body);font-weight:500;font-size:17px;line-height:1.5;font-synthesis:none}
button,input{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);font-weight:800;line-height:1.1;margin:0;text-wrap:balance}
p{margin:0}
.wrap{max-width:920px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 28px;display:flex;flex-direction:column;gap:16px;min-height:100%;position:relative;z-index:1}

.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;background:var(--card);border:3px solid var(--line);border-radius:20px;padding:10px 16px}
.brand{font-family:var(--font-display);font-weight:800;font-size:22px;color:var(--blue)}
.steps{display:flex;flex-wrap:wrap;gap:6px}
.steps button{min-height:40px;padding:0 14px;border-radius:99px;border:2px solid var(--line);background:var(--card);cursor:pointer;font-weight:800;font-size:14px;color:var(--muted)}
.steps button.on{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.steps button.done{border-color:var(--green);color:var(--ink)}
:focus-visible{outline:3px solid var(--purple);outline-offset:2px}

main{min-width:0}
.slide{background:var(--card);border:3px solid var(--line);border-radius:28px;padding:clamp(16px,4vw,32px);display:flex;flex-direction:column;gap:16px;min-width:0}
.slide h2{font-size:clamp(26px,5.5vw,36px)}
.lead{color:var(--muted);font-size:18px}
.tag{display:inline-block;align-self:flex-start;background:var(--sun);color:var(--sun-ink);font-weight:800;font-size:14px;padding:4px 14px;border-radius:99px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 24px;border:0;border-radius:16px;background:var(--blue);color:var(--blue-ink);font-weight:800;font-size:18px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.2);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 5px 0 var(--line)}
.btn.sun{background:var(--sun);color:var(--sun-ink)}
.btn.go{background:linear-gradient(90deg,var(--coral),var(--sun),var(--green));color:var(--blk-ink);font-size:clamp(19px,5vw,24px);min-height:60px;padding:0 34px;animation:wig 1.8s ease-in-out infinite}
.btn:disabled{opacity:.45;cursor:not-allowed}
.nav{display:flex;justify-content:space-between;gap:12px}
.nav .btn{flex:0 1 auto}

/* adegan gambar */
.scene{position:relative;aspect-ratio:5/3;max-width:100%;container-type:inline-size;border-radius:20px;overflow:hidden;border:3px solid var(--line);background:linear-gradient(var(--sky1) 0 70%,var(--grass) 70%)}
.scene.sea{background:linear-gradient(var(--sky1) 0 38%,var(--sea) 38%)}
.it{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:.6cqw;line-height:1;text-align:center}
.em svg,.em2 svg,.flt svg{display:block;width:1em;height:1em;overflow:visible}
.em{display:block;font-size:calc(var(--s,15)*1cqw);line-height:1;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--n,0)*90ms)}
.lb{font-weight:800;font-size:clamp(11px,3.3cqw,15px);line-height:1;color:var(--ink);background:color-mix(in srgb,var(--card) 82%,transparent);padding:3px 8px;border-radius:99px;white-space:nowrap}
.box{position:absolute;transform:translate(-50%,-50%);width:calc(var(--w)*1cqw);height:calc(var(--h)*1cqw)}
.crate-back{background:var(--wood);border-radius:2cqw}
.crate-front{background:var(--wood2);border-radius:0 0 2cqw 2cqw;display:grid;place-items:center}
.tabletop{background:var(--wood2);border-radius:1cqw;box-shadow:0 1cqw 0 var(--wood)}
.leg{background:var(--wood);border-radius:1cqw}
.zone{position:absolute;transform:translate(-50%,-50%);width:15cqw;height:15cqw;border-radius:50%;border:3px dashed var(--blue);background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue);font-family:var(--font-display);font-weight:800;font-size:7cqw;line-height:1;cursor:pointer;z-index:3;padding:0;animation:pulse 1.8s ease-in-out infinite}
.slide.locked .zone{pointer-events:none;animation:none;opacity:.35}
.mover{transition:left .6s cubic-bezier(.5,1.4,.6,1),top .6s cubic-bezier(.5,1.4,.6,1);pointer-events:none}
.mover .em{animation:none}

.sentence{font-family:var(--font-display);font-weight:800;font-size:clamp(24px,5vw,34px);line-height:1.2}
.sentence b{color:var(--blue);background:color-mix(in srgb,var(--sun) 55%,transparent);border-radius:8px;padding:0 6px}
.tip{background:color-mix(in srgb,var(--sun) 28%,var(--card));border:2px solid var(--sun);border-radius:16px;padding:12px 16px;font-weight:800}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:48px;padding:0 18px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:800;cursor:pointer}
.chip.on{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}

/* sampul */
.cover{position:relative;overflow:hidden;align-items:center;text-align:center;gap:18px;border-color:var(--purple);padding-top:clamp(30px,6vw,46px);padding-bottom:clamp(30px,6vw,46px);
  background:
    radial-gradient(circle at 3% 31%,var(--coral) 0 5px,transparent 6px),
    radial-gradient(circle at 93% 33%,var(--green) 0 6px,transparent 7px),
    radial-gradient(circle at 5% 52%,var(--sun) 0 6px,transparent 7px),
    radial-gradient(circle at 95% 60%,var(--purple) 0 5px,transparent 6px),
    radial-gradient(circle at 12% 78%,var(--blue) 0 5px,transparent 6px),
    radial-gradient(circle at 89% 86%,var(--coral) 0 6px,transparent 7px),
    linear-gradient(180deg,color-mix(in srgb,var(--sky1) 75%,var(--card)) 0%,color-mix(in srgb,var(--sun) 24%,var(--card)) 50%,color-mix(in srgb,var(--coral) 20%,var(--card)) 100%)}
.cover::before,.cover::after{content:"";position:absolute;left:0;right:0;height:14px;background:linear-gradient(90deg,var(--coral) 0 20%,var(--sun) 20% 40%,var(--green) 40% 60%,var(--blue) 60% 80%,var(--purple) 80%)}
.cover::before{top:0}.cover::after{bottom:0}
.cover>*{max-width:100%}
.cover .ident{align-self:stretch;text-align:left}
.cover .field{align-items:center;align-self:stretch}
.cover .field input{border:3px solid var(--blue);box-shadow:0 4px 0 color-mix(in srgb,var(--blue) 35%,transparent)}
.cover .tag{align-self:center;background:linear-gradient(90deg,var(--sun),var(--green));color:var(--blk-ink);font-size:15px;padding:5px 18px;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.cover h1{display:flex;flex-direction:column;align-items:center;gap:12px;font-size:inherit}
.ribbon{display:inline-block;background:var(--coral);color:var(--blk-ink);font-family:var(--font-display);font-weight:800;font-size:clamp(20px,5.5vw,30px);line-height:1.2;padding:4px 24px;border-radius:12px;transform:rotate(-3deg);box-shadow:0 4px 0 rgba(0,0,0,.22)}
.word{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(4px,1.2vw,8px)}
.blk{display:grid;place-items:center;width:clamp(40px,11.5vw,72px);aspect-ratio:1;border-radius:16%;background:var(--c);color:var(--blk-ink);font-family:var(--font-display);font-weight:800;font-size:clamp(28px,8.5vw,54px);line-height:1;box-shadow:inset 0 -5px 0 rgba(0,0,0,.18),0 6px 0 rgba(0,0,0,.22);transform:rotate(var(--r));animation:hop 2.4s ease-in-out infinite;animation-delay:calc(var(--n)*110ms)}
.flt{position:absolute;font-style:normal;font-size:clamp(40px,11vw,60px);line-height:1;pointer-events:none;animation:bob 3s ease-in-out infinite}
.twk{position:absolute;font-style:normal;font-size:clamp(20px,5vw,30px);line-height:1;pointer-events:none;animation:twk 2s ease-in-out infinite}
.mascots{display:grid;grid-template-columns:repeat(3,auto);gap:clamp(6px,3vw,24px);align-items:end;justify-items:center;justify-content:center;align-self:stretch;padding:6px 8px 0;border-radius:24px 24px 0 0;
  background:
    radial-gradient(circle at 9% 90%,var(--coral) 0 4px,transparent 5px),
    radial-gradient(circle at 27% 82%,var(--sun) 0 4px,transparent 5px),
    radial-gradient(circle at 72% 88%,var(--blue) 0 4px,transparent 5px),
    radial-gradient(circle at 92% 81%,var(--purple) 0 4px,transparent 5px),
    radial-gradient(ellipse 100% 44% at 50% 100%,var(--grass) 0 98%,transparent 100%)}
.mc{display:flex;flex-direction:column;align-items:center;gap:12px}
.mc .em2{display:block;font-size:clamp(66px,21vw,112px);line-height:1;animation:bob 2.2s ease-in-out infinite}
.mc:nth-child(2) .em2{animation-delay:.3s;font-size:clamp(78px,25vw,132px)}.mc:nth-child(3) .em2{animation-delay:.6s}
.bub{position:relative;background:var(--card);border:3px solid var(--ink);border-radius:16px;padding:4px 10px;font-weight:800;font-size:clamp(12px,3.4vw,15px);line-height:1.2;max-width:120px}
.bub::after{content:"";position:absolute;left:50%;bottom:-9px;width:12px;height:12px;background:var(--card);border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.ident{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.ident div{--k:var(--blue);background:color-mix(in srgb,var(--k) 20%,var(--card));border:3px solid var(--k);border-radius:16px;padding:10px 14px;min-width:0}
.ident div:nth-child(2){--k:var(--green)}.ident div:nth-child(3){--k:var(--coral)}.ident div:nth-child(4){--k:var(--purple)}
.ident small{display:block;color:var(--ink);opacity:.78;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:800}
.field input,.ans{min-height:52px;border-radius:14px;border:2px solid var(--line);background:var(--card);padding:0 16px;font-size:20px;font-weight:800;width:100%;max-width:420px}

.goals{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.goal{border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:6px;background:color-mix(in srgb,var(--c) 14%,var(--card));border:2px solid color-mix(in srgb,var(--c) 45%,var(--card));min-width:0}
.goal .ic{font-size:36px;line-height:1}
.goal h3{font-size:21px}
.big{font-family:var(--font-display);font-weight:800;font-size:clamp(22px,4.6vw,30px);line-height:1.25;background:color-mix(in srgb,var(--sun) 30%,var(--card));border:3px solid var(--sun);border-radius:20px;padding:16px 20px}

/* kuis */
.qhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.bar{height:14px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .4s}
.blank{display:inline-block;min-width:3.2em;text-align:center;border-bottom:4px solid var(--blue);color:var(--blue);padding:0 6px}
.blank.ok{color:var(--green);border-color:var(--green)}.blank.no{color:var(--coral);border-color:var(--coral)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.opt{min-height:56px;border-radius:16px;border:3px solid var(--line);background:var(--card);font-weight:800;font-size:19px;cursor:pointer;padding:6px 12px}
.opt:hover{border-color:var(--blue)}
.opt.ok{background:var(--green-bg);border-color:var(--green)}
.opt.no{background:var(--coral-bg);border-color:var(--coral)}
.opt:disabled{cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fb{border-radius:18px;padding:14px 18px;display:flex;flex-direction:column;gap:6px;border:2px solid var(--line)}
.fb.ok{background:var(--green-bg);border-color:var(--green)}
.fb.no{background:var(--coral-bg);border-color:var(--coral)}
.fb.hint{border-style:dashed}
.fb .mot{font-weight:800}
.cmd{font-family:var(--font-display);font-weight:800;font-size:clamp(22px,4.6vw,30px);line-height:1.2}
.cmd b{color:var(--blue)}

/* hasil */
.score{display:flex;flex-wrap:wrap;align-items:center;gap:6px 20px}
.score .num{font-family:var(--font-display);font-weight:800;font-size:clamp(52px,12vw,84px);line-height:1;color:var(--blue)}
.stars{font-size:clamp(28px,7vw,40px);letter-spacing:2px;line-height:1}
.dots{display:flex;flex-wrap:wrap;gap:8px}
.dots span{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:800;border:2px solid var(--line)}
.dots .y{background:var(--green-bg);border-color:var(--green)}.dots .n{background:var(--coral-bg);border-color:var(--coral)}
.feel{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.feel button{display:flex;flex-direction:column;align-items:center;gap:4px;border-radius:18px;border:3px solid var(--line);background:var(--card);padding:12px 8px;font-weight:800;cursor:pointer;min-height:100px}
.feel button .e{font-size:38px;line-height:1}
.feel button.on{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 14%,var(--card))}
.checks{display:flex;flex-direction:column;gap:8px}
.checks button{display:flex;align-items:center;gap:12px;min-height:52px;border-radius:14px;border:2px solid var(--line);background:var(--card);padding:6px 14px;text-align:left;font-weight:800;cursor:pointer}
.checks button .bx{flex:none;width:30px;height:30px;border-radius:8px;border:3px solid var(--blue);display:grid;place-items:center;color:var(--blue-ink);font-size:18px}
.checks button.on .bx{background:var(--green);border-color:var(--green)}

/* ruang kelas: dinding coklat, lantai kayu, benda-benda kelas */
.room{position:fixed;inset:0;z-index:0;pointer-events:none}
.floorfix{position:absolute;left:0;right:0;bottom:0;height:11vh;min-height:64px;background:repeating-linear-gradient(90deg,var(--floor) 0 90px,var(--floor2) 90px 93px);border-top:8px solid var(--floor2)}
.side{display:none;position:absolute;top:18vh;flex-direction:column;gap:5vh;font-size:60px;line-height:1}
.side span{display:block;animation:bob 3.4s ease-in-out infinite}
.side span:nth-child(2){animation-delay:.6s}.side span:nth-child(3){animation-delay:1.2s}
.side.l{right:calc(50% + 480px)}
.side.r{left:calc(50% + 480px)}
@media (min-width:1160px){.side{display:flex}}
.roomtop{display:flex;flex-direction:column;gap:8px}
.wallrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wo{flex:none;font-size:clamp(30px,8vw,46px);line-height:1}
.chalk{flex:1 1 auto;max-width:360px;min-width:0;background:var(--board);color:var(--chalk);border:6px solid var(--floor2);border-radius:8px;padding:6px 12px;text-align:center;font-family:var(--font-display);font-weight:800;line-height:1.1;box-shadow:inset 0 0 12px rgba(0,0,0,.28)}
.chalk b{display:block;font-size:clamp(16px,4.4vw,22px)}
.chalk span{font-size:clamp(13px,3.6vw,17px);opacity:.92}
.shelf{display:flex;justify-content:space-around;gap:6px;border-bottom:8px solid var(--floor2);padding:0 6px 2px;font-size:clamp(26px,7vw,38px);line-height:1}
.roomfloor{display:flex;justify-content:space-around;align-items:flex-end;gap:6px;background:repeating-linear-gradient(90deg,var(--floor) 0 70px,var(--floor2) 70px 73px);border-radius:18px;padding:8px 12px;font-size:clamp(30px,8vw,44px);line-height:1}
.roomfloor span{display:block;animation:bob 3s ease-in-out infinite}
.roomfloor span:nth-child(2n){animation-delay:.5s}.roomfloor span:nth-child(3n){animation-delay:1s}
/* font khusus tiap menu */
#stage[data-m="0"]{--font-display:"Chewy","Trebuchet MS",system-ui,sans-serif}
#stage[data-m="1"]{--font-display:"Sniglet","Trebuchet MS",system-ui,sans-serif}
#stage[data-m="2"]{--font-display:"Bubblegum Sans","Trebuchet MS",system-ui,sans-serif}
#stage[data-m="3"]{--font-display:"Luckiest Guy","Trebuchet MS",system-ui,sans-serif}
#stage[data-m="4"]{--font-display:"Lilita One","Trebuchet MS",system-ui,sans-serif}
#stage[data-m="5"]{--font-display:"Grandstander","Trebuchet MS",system-ui,sans-serif}
#stage[data-m="3"] h2,#stage[data-m="3"] .cmd{letter-spacing:.03em}
[hidden]{display:none!important}

/* ruang pesta untuk menu Main */
.scene.party{background:radial-gradient(circle,rgba(255,255,255,.5) 0 3px,transparent 4px) 0 0/26px 26px,linear-gradient(180deg,var(--pw1) 0,var(--pw2) 70%,transparent 70%),repeating-linear-gradient(90deg,var(--pf1) 0 12%,var(--pf2) 12% 24%)}
.pickrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pickbtn{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;min-height:132px;border-radius:20px;border:3px solid var(--line);background:var(--card);padding:10px 6px;font-weight:700;font-size:16px;line-height:1.2;cursor:pointer;transition:transform .12s,border-color .12s}

.kid{display:block;font-size:clamp(54px,14vw,84px);line-height:1;animation:bob 2.6s ease-in-out infinite}

.kid .blink{animation:blink 4.2s infinite}
.kid.jump{animation:hop2 .8s ease-in-out infinite}
.kid.jump .wave{animation-duration:.45s}
.kid.late{animation-delay:.7s}.kid.late .wave{animation-delay:.4s}
.fkid{flex:none}
.kidpair{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end;justify-items:center;padding-top:6px}

.sidekid{display:none;align-items:flex-end;position:absolute;bottom:3vh}
.sidekid .kid{font-size:min(84px,calc((50vw - 484px) / 1.85))}
.sidekid .kid + .kid{margin-left:-.2em}
.sidekid.l{right:calc(50% + 476px)}
.sidekid.r{left:calc(50% + 476px)}
@media (min-width:1160px){.sidekid{display:flex}}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-24deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes hop2{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
.kid .wave{animation-delay:var(--d,0s)}
.kid.flip svg{transform:scaleX(-1)}

  background:

<script>

    }

    }
    function first(e){

    function init(){
      try{ if(localStorage.getItem('pb_music') === 'off') enabled = false; }catch(e){}

  })();

  var esc = function(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };

  }
  /* ---------- ilustrasi 3D bergaya mainan (gradasi, kilau, bayangan lantai) ---------- */

  function defsSvg(){

  var ART = {

    }
    var R = ROUNDS[A.i];
    var part = R.k === 'taruh' ? 'Bagian 1 · Taruh Benda' : 'Bagian 2 · Tebak Gambar';
    var head = '<h2>Ayo Bermain!</h2>' +
      '<div class="qhead"><span class="tag">' + part + '</span><span class="tag">Ronde ' + (A.i+1) + ' dari ' + total + '</span></div>' +
      '<div class="bar" aria-hidden="true"><i style="width:' + (A.i / total * 100) + '%"></i></div>' +
      '<p class="cmd">' + R.txt + '</p>';
    if(R.k === 'taruh'){
      var zones = Object.keys(ZP).map(function(z){
        return '<button class="zone" type="button" data-act="zone" data-z="' + z + '" style="left:' + ZP[z][0] + '%;top:' + ZP[z][1] + '%" aria-label="Letakkan ' + LBL[z] + ' meja">?</button>';
      }).join('');
      var mover = '<div id="mover" class="it mover" style="left:' + START[0] + '%;top:' + START[1] + '%;--s:12;z-index:5"><span class="em">' + R.o + '</span></div>';
      return '<section class="slide" id="actSlide">' + head +
        scene(PARTY, 'party', zones + mover) +
        '<div id="actMsg" class="fb hint">Ketuk lingkaran bertanda ? untuk meletakkan ' + R.n.toLowerCase() + '.</div>' +
        '<div class="row"><button id="actNext" class="btn sun" type="button" data-act="actnext" hidden>Ronde berikutnya ▶</button></div>' +
      '</section>';
    }
    return '<section class="slide" id="actSlide">' + head +
      scene(PARTY_TEBAK, 'party') +
      '<div class="pickrow">' + R.opts.map(function(o){
        return '<button class="pickbtn" type="button" data-act="pick" data-v="' + o[0] + '" aria-label="' + o[1] + '"><span class="pe">' + ART[o[0]] + '</span><span>' + o[1] + '</span></button>';
      }).join('') + '</div>' +
      '<div id="actMsg" class="fb hint">Lihat gambarnya baik-baik, lalu ketuk jawabanmu.</div>' +
      '<div class="row"><button id="actNext" class="btn sun" type="button" data-act="actnext" hidden>' + (A.i === total-1 ? 'Selesai' : 'Ronde berikutnya') + ' ▶</button></div>' +
    '</section>';
  }

  function quizView(){
    var i = st.quiz.i, q = Q[i], r = st.quiz.res[i];
    var shown = r ? (q.type === 'pg' ? r.val : (r.val || '…')) : '_____';
    var sentence = q.t.replace('__', '<span class="blank ' + (r ? (r.ok ? 'ok' : 'no') : '') + '">' + esc(shown) + '</span>');
    var body;
    if(q.type === 'pg'){
      body = '<div class="opts">' + q.o.map(function(o){
        var cls = r ? (o === q.a ? 'ok' : (o === r.val ? 'no' : '')) : '';
        return '<button class="opt ' + cls + '" type="button" data-act="opt" data-v="' + o + '"' + (r ? ' disabled' : '') + '>' + o + '</button>';
      }).join('') + '</div>';
    } else {
      body = '<div class="field"><label for="ans">Ketik kata yang tepat, atau ketuk kata di bawah.</label>' +
        '<input id="ans" class="ans" type="text" autocomplete="off" autocapitalize="none" placeholder="Jawabanmu" value="' + (r ? esc(r.val) : '') + '"' + (r ? ' disabled' : '') + '></div>' +
        '<div class="chips">' + BANK.map(function(b){
          return '<button class="chip" type="button" data-act="chip" data-v="' + b + '"' + (r ? ' disabled' : '') + '>' + b + '</button>';
        }).join('') + '</div>' +
        (r ? '' : '<div class="row"><button class="btn" type="button" data-act="check">Periksa Jawaban</button></div>');
    }
    var fb = '';
    if(r){
      if(r.ok){
        fb = '<div class="fb ok"><b>' + PRAISE[i % PRAISE.length] + ', ' + nm() + '! Jawabanmu benar. 🌟</b><p>Satu bintang untukmu.</p></div>';
      } else {
        fb = '<div class="fb no"><b>Belum tepat.</b><p>Jawaban yang benar: <strong>' + q.a + '</strong>.</p><p>' + q.why + '</p><p class="mot">' + MOT[i % MOT.length] + ' 💪</p></div>';
      }
      fb += '<div class="row"><button class="btn sun" type="button" data-act="qnext">' + (i === Q.length-1 ? 'Lihat Hasil' : 'Soal berikutnya') + ' ▶</button></div>';
    }
    return '<section class="slide">' +
      '<div class="qhead"><h2>Kuis Posisi Benda</h2><span class="tag">Soal ' + (i+1) + ' dari ' + Q.length + ' · ' + (q.type === 'pg' ? 'Pilihan ganda' : 'Isian') + '</span></div>' +
      '<div class="bar" aria-hidden="true"><i style="width:' + (st.quiz.res.filter(Boolean).length / Q.length * 100) + '%"></i></div>' +
      scene(q.sc, q.bg) +
      '<p class="sentence">' + sentence + '</p>' +
      body + fb +
    '</section>';
  }

  function resultView(){
    var res = st.quiz.res;
    if(res.some(function(r){ return !r; })){
      return '<section class="slide"><h2>Hasil Belajar</h2><p class="lead">Selesaikan dulu kuisnya ya, ' + nm() + '. Setelah itu hasilmu muncul di sini.</p>' +
        '<div class="row"><button class="btn" type="button" data-act="go" data-i="4">Ke Kuis ▶</button></div></section>';
    }
    var ok = res.filter(function(r){ return r.ok; }).length;
    var score = ok * 10;
    var stars = Math.round(score / 20);
    var msg, again = '';
    if(score >= 80){ msg = 'Luar biasa, ' + nm() + '! Kamu sudah paham posisi benda terhadap benda lain.'; }
    else if(score >= 50){ msg = 'Bagus, ' + nm() + '! Tinggal sedikit lagi. Lihat kembali soal yang belum tepat, lalu coba lagi.'; }
    else { msg = 'Terima kasih sudah mencoba, ' + nm() + '. Yuk baca materinya sekali lagi. Kamu pasti bisa!'; again = '<button class="btn alt" type="button" data-act="go" data-i="2">Baca Materi Lagi</button>'; }
    var feelData = [
      {e:'😀', t:'Aku sudah paham', r:'Hebat! Coba cari benda di rumah dan ceritakan posisinya kepada temanmu.'},
      {e:'🙂', t:'Aku mulai paham', r:'Bagus! Latihan sedikit lagi, kamu pasti makin lancar.'},
      {e:'🤔', t:'Aku masih bingung', r:'Tidak apa-apa. Tanyakan kepada gurumu atau main lagi di bagian Ayo Bermain.'}
    ];
    var checks = ['Aku bisa menunjuk benda di atas dan di bawah.','Aku bisa membedakan kiri dan kanan.','Aku bisa bilang benda di depan, di belakang, di dalam, dan di antara.'];
    return '<section class="slide">' +
      '<h2>Hasil Belajarmu</h2>' +
      '<div class="score"><span class="num">' + score + '</span><div><div class="stars" aria-label="' + stars + ' dari 5 bintang">' + '⭐'.repeat(stars) + '☆'.repeat(5-stars) + '</div><p>' + ok + ' dari 10 soal benar</p></div></div>' +
      '<p class="big">' + msg + '</p>' +
      (score >= 80 ? kidPair('Hore! Kamu hebat, ' + nm() + '!', 'Selamat ya! Kamu sudah paham!', true) : kidPair('Semangat ya, ' + nm() + '!', 'Ayo kita coba lagi!', false)) +
      '<div class="dots" aria-label="Rincian jawaban">' + res.map(function(r,i){ return '<span class="' + (r.ok ? 'y' : 'n') + '">' + (i+1) + (r.ok ? '✓' : '✗') + '</span>'; }).join('') + '</div>' +
      '<h3>Ayo Berefleksi</h3>' +
      '<p class="lead">Bagaimana perasaanmu setelah belajar hari ini?</p>' +
      '<div class="feel">' + feelData.map(function(f,i){
        return '<button type="button" class="' + (st.feel === i ? 'on' : '') + '" data-act="feel" data-i="' + i + '"><span class="e">' + f.e + '</span>' + f.t + '</button>';
      }).join('') + '</div>' +
      (st.feel !== null ? '<div class="fb ok"><b>' + feelData[st.feel].r + '</b></div>' : '') +
      '<p class="lead">Centang yang sudah bisa kamu lakukan:</p>' +
      '<div class="checks">' + checks.map(function(c,i){
        return '<button type="button" class="' + (st.checks[i] ? 'on' : '') + '" data-act="check3" data-i="' + i + '"><span class="bx">' + (st.checks[i] ? '✓' : '') + '</span>' + c + '</button>';
      }).join('') + '</div>' +
      '<div class="row">' + again + '<button class="btn sun" type="button" data-act="quizreset">Ulangi Kuis</button></div>' +
    '</section>';
  }

  var VIEWS = [coverView, goalView, matView, actView, quizView, resultView];

  function render(){
    $('#stage').setAttribute('data-m', st.slide);
    $('#stage').innerHTML = VIEWS[st.slide]();
    $('#steps').innerHTML = STEPS.map(function(s,i){
      var cls = i === st.slide ? 'on' : (i < st.slide ? 'done' : '');
      return '<button type="button" class="' + cls + '" data-act="go" data-i="' + i + '"' + (i === st.slide ? ' aria-current="step"' : '') + '>' + s + '</button>';
    }).join('');
    $('#prev').hidden = st.slide === 0;
    var nx = $('#next');
    nx.hidden = st.slide === 0 || st.slide >= 4;
    nx.textContent = st.slide === 3 ? 'Ke Kuis ▶' : 'Lanjut ▶';
  }
  function go(n){
    st.slide = Math.max(0, Math.min(VIEWS.length-1, n));
    render();
    window.scrollTo({top:0, behavior: reduce ? 'auto' : 'smooth'});
  }

  function burst(el){
    Music.sfx(true);
    if(reduce || !el) return;
    var r = el.getBoundingClientRect();
    var icons = ['⭐','✨','🎉'];
    for(var i = 0; i < 10; i++){
      var s = document.createElement('span');
      s.className = 'spark';
      s.textContent = icons[i % 3];
      s.style.left = (r.left + r.width/2) + 'px';
      s.style.top = (r.top + r.height/2) + 'px';
      s.style.setProperty('--dx', (Math.random()*180 - 90) + 'px');
      s.style.setProperty('--dy', (-50 - Math.random()*110) + 'px');
      document.body.appendChild(s);
      setTimeout((function(n){ return function(){ n.remove(); }; })(s), 950);
    }
  }

  function norm(v){ return String(v).toLowerCase().trim().replace(/\s+/g,' ').replace(/^di\s+/,'').replace(/^sebelah\s+/,''); }

  function answer(v){
    var i = st.quiz.i, q = Q[i];
    if(st.quiz.res[i]) return;
    var ok = q.type === 'pg' ? v === q.a : norm(v) === q.a;
    st.quiz.res[i] = {ok:ok, val:v};
    render();
    if(ok){ var b = document.querySelector('.fb.ok'); burst(b); } else { Music.sfx(false); }
  }

  /* ---------- aksi ---------- */
  var A = {
    go: function(b){ go(+b.dataset.i); },
    mat: function(b){ st.mat = +b.dataset.i; render(); },
    zone: function(b){
      var a = st.act; if(a.ok) return;
      var R = ROUNDS[a.i], z = b.dataset.z, p = ZP[z];
      var mv = $('#mover'), msg = $('#actMsg');
      mv.style.left = p[0] + '%'; mv.style.top = p[1] + '%';
      clearTimeout(a.t);
      if(z === R.t){
        a.ok = true;
        msg.className = 'fb ok';
        msg.innerHTML = '<b>' + PRAISE[a.i % PRAISE.length] + ', ' + nm() + '! ' + R.n + ' berada ' + LBL[z] + ' meja. 🌟</b>';
        $('#actNext').hidden = false;
        $('#actSlide').classList.add('locked');
        burst(mv);
      } else {
        Music.sfx(false);
        msg.className = 'fb no';
        msg.innerHTML = '<b>Belum tepat.</b><p>' + HINT[R.t] + ' Coba lagi ya!</p>';
        a.t = setTimeout(function(){ mv.style.left = START[0] + '%'; mv.style.top = START[1] + '%'; }, 1000);
      }
    },
    actnext: function(){ st.act.i++; st.act.ok = false; render(); },
    actreset: function(){ st.act = {i:0, ok:false, t:null}; render(); },
    pick: function(b){
      var a = st.act; if(a.ok) return;
      var R = ROUNDS[a.i], v = b.dataset.v, msg = $('#actMsg');
      if(v === R.a){
        a.ok = true;
        b.classList.add('ok');
        document.querySelectorAll('.pickbtn').forEach(function(x){ x.disabled = true; });
        msg.className = 'fb ok';
        msg.innerHTML = '<b>' + PRAISE[a.i % PRAISE.length] + ', ' + nm() + '! ' + R.ok + ' 🌟</b>';
        $('#actNext').hidden = false;
        burst(b);
      } else {
        b.classList.add('no'); b.disabled = true; Music.sfx(false);
        msg.className = 'fb no';
        msg.innerHTML = '<b>Belum tepat.</b><p>' + R.hint + ' Coba lagi ya!</p>';
      }
    },
    opt: function(b){ answer(b.dataset.v); },
    chip: function(b){ var inp = $('#ans'); if(inp && !inp.disabled){ inp.value = b.dataset.v; inp.focus(); } },
    check: function(){
      var inp = $('#ans'); var v = inp ? inp.value.trim() : '';
      if(!v){ if(inp) inp.focus(); return; }
      answer(v);
    },
    qnext: function(){
      if(st.quiz.i === Q.length - 1){ go(5); } else { st.quiz.i++; render(); window.scrollTo({top:0, behavior: reduce ? 'auto' : 'smooth'}); }
    },
    quizreset: function(){ st.quiz = {i:0, res:new Array(10).fill(null)}; st.feel = null; st.checks = [false,false,false]; go(4); },
    feel: function(b){ st.feel = +b.dataset.i; render(); },
    check3: function(b){ var i = +b.dataset.i; st.checks[i] = !st.checks[i]; render(); }
  };

  document.addEventListener('click', function(e){
    var b = e.target.closest('[data-act]');
    if(b && A[b.dataset.act]) A[b.dataset.act](b);
  });
  document.addEventListener('input', function(e){ if(e.target.id === 'nm') st.name = e.target.value; });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && e.target.id === 'ans'){ A.check(); }
    if(e.key === 'Enter' && e.target.id === 'nm'){ go(1); }
  });
  $('#prev').addEventListener('click', function(){ go(st.slide - 1); });
  $('#next').addEventListener('click', function(){ go(st.slide + 1); });

  document.body.insertAdjacentHTML('afterbegin', defsSvg());
  Music.init();
  [['kidL',[0,2]],['kidR',[1,3]],['kidF1',[0]],['kidF2',[3]],['kidF3',[4]],['kidF4',[5]]].forEach(function(k){
    var el = document.getElementById(k[0]); if(!el) return;
    el.innerHTML = k[1].map(function(ix, n){
      return '<div class="kid' + (n % 2 ? ' late' : '') + '" style="--d:' + (ix*0.17).toFixed(2) + 's">' + ART.crowd[ix] + '</div>';
    }).join('');
  });
  render();
})();
</script>

</body></html>
